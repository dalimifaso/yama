<title>ימאות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Suez+One&family=IBM+Plex+Mono:wght@400;600&display=swap">

<style>
:root{
  --ground:#E4E8ED; --panel:#FFFFFF; --plate:#0B1119;
  --ink:#111A24; --muted:#5A6774; --line:#C4CDD9; --line-soft:#DCE2EA;
  --brass:#8A5E0C; --brass-bright:#B8811A;
  --ok:#1E7A50; --ok-bg:#E2F1E9; --bad:#A83A34; --bad-bg:#F7E6E4;
  --port:#C0392B; --stbd:#1E7A50;
  --shadow:0 1px 2px rgba(16,26,38,.06),0 8px 24px -12px rgba(16,26,38,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#060A10; --panel:#0E1520; --plate:#05080D;
    --ink:#DCE4EE; --muted:#7E8C9E; --line:#1D2937; --line-soft:#16202B;
    --brass:#E0A63A; --brass-bright:#F0BE60;
    --ok:#49B583; --ok-bg:#11251D; --bad:#DD7069; --bad-bg:#2A1513;
    --port:#E0685E; --stbd:#49B583;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#060A10; --panel:#0E1520; --plate:#05080D;
  --ink:#DCE4EE; --muted:#7E8C9E; --line:#1D2937; --line-soft:#16202B;
  --brass:#E0A63A; --brass-bright:#F0BE60;
  --ok:#49B583; --ok-bg:#11251D; --bad:#DD7069; --bad-bg:#2A1513;
  --port:#E0685E; --stbd:#49B583;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:'Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.app{direction:rtl; max-width:1080px; margin:0 auto; padding:0 18px 72px}
.narrow{max-width:780px; margin:0 auto}
button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--brass-bright); outline-offset:3px; border-radius:3px}

/* ---------- masthead ---------- */
.masthead{
  display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
  padding:26px 0 14px; position:relative;
}
.brandline{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
h1{
  font-family:'Suez One',Georgia,serif; font-weight:400;
  font-size:clamp(28px,6vw,38px); line-height:1; margin:0; letter-spacing:-.01em;
}
.sub{font-size:13.5px; color:var(--muted); letter-spacing:.02em}
.gauge{display:flex; gap:14px; align-items:baseline; color:var(--muted); font-size:13px; padding-bottom:4px}
.gauge span{display:flex; gap:6px; align-items:baseline; white-space:nowrap}
.gauge span+span{padding-inline-start:14px; border-inline-start:1px solid var(--line)}
.gauge bdi{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;
  font-size:13px; font-weight:600; color:var(--brass)}

/* ---------- page nav ---------- */
.pagenav{display:flex; gap:2px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:22px}
.pagenav button{
  background:transparent; border:0; border-bottom:2px solid transparent;
  padding:9px 15px 8px; color:var(--muted); font-size:15.5px; margin-bottom:-1px;
}
.pagenav button:hover{color:var(--ink)}
.pagenav button[aria-current="true"]{color:var(--ink); font-weight:700; border-bottom-color:var(--brass)}

/* ---------- deck / tabs ---------- */
.decks{display:flex; flex-wrap:wrap; gap:7px; margin:0 0 8px}
.deck{
  background:transparent; border:1px solid var(--line); border-radius:2px;
  padding:7px 13px 6px; display:flex; align-items:baseline; gap:7px;
  transition:border-color .15s, background .15s, color .15s;
}
.deck:hover{border-color:var(--brass)}
.deck .cnt{font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11px; color:var(--muted);
  font-variant-numeric:tabular-nums}
.deck[aria-pressed="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink)}
.deck[aria-pressed="true"] .cnt{color:var(--ground); opacity:.6}

.modes{display:flex; margin:14px 0 22px; border:1px solid var(--line); border-radius:2px; overflow:hidden; width:fit-content}
.modes button{background:transparent; border:0; padding:6px 16px; font-size:14px; color:var(--muted)}
.modes button+button{border-inline-start:1px solid var(--line)}
.modes button[aria-pressed="true"]{background:var(--ink); color:var(--ground); font-weight:600}

/* ---------- progress ---------- */
.track{height:2px; background:var(--line-soft); margin-bottom:22px; position:relative}
.track i{position:absolute; inset-block:0; inset-inline-start:0; background:var(--brass); transition:width .3s ease}

/* ---------- question plate ---------- */
.plate{background:var(--panel); border:1px solid var(--line); border-radius:2px;
  padding:14px; box-shadow:var(--shadow); position:relative}
.cartouche{
  background:var(--plate); border:1px solid var(--line);
  padding:20px 14px; display:flex; align-items:center; justify-content:center;
  min-height:250px; position:relative;
}
.cartouche::before{content:""; position:absolute; inset:6px; border:1px solid rgba(224,166,58,.22); pointer-events:none}
.cartouche img{display:block; max-width:100%; max-height:280px; height:auto}
.stamp{position:absolute; top:9px; inset-inline-start:12px; z-index:2; font-size:12px; color:var(--brass); opacity:.8}
.stamp bdi{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
.stem{
  background:var(--panel); border:1px solid var(--line); border-inline-start:3px solid var(--brass);
  border-radius:2px; padding:22px 22px 24px; box-shadow:var(--shadow);
  font-family:'Suez One',Georgia,serif; font-size:clamp(19px,2.6vw,23px); line-height:1.45;
  text-wrap:balance;
}
.stem .eyebrow{display:block; font-family:'Assistant',sans-serif; font-size:13px; font-weight:600;
  color:var(--brass); margin-bottom:9px}
.horn{
  margin-top:12px; display:flex; align-items:center; justify-content:center; gap:9px;
  background:transparent; border:1px solid var(--brass); color:var(--brass);
  border-radius:2px; padding:8px 18px; width:100%; font-size:15px; font-weight:600;
  transition:background .15s,color .15s;
}
.horn:hover,.horn.on{background:var(--brass); color:var(--plate)}
.horn svg{width:15px; height:15px; flex:none}

.ask{margin:24px 0 13px; font-size:16px; font-weight:600; color:var(--muted);
  display:flex; align-items:center; gap:11px}
.ask::after{content:""; flex:1; height:1px; background:var(--line)}

/* ---------- options ---------- */
.opts{display:flex; flex-direction:column; gap:8px}
.opt{
  display:flex; align-items:flex-start; gap:12px; text-align:start;
  background:var(--panel); border:1px solid var(--line); border-radius:2px;
  padding:12px 14px; line-height:1.45; transition:border-color .15s, background .12s;
}
.opt:not(:disabled):hover{border-color:var(--brass)}
.opt .key{font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:12px; font-weight:600;
  color:var(--muted); border:1px solid var(--line); border-radius:2px;
  min-width:22px; height:22px; display:grid; place-items:center; flex:none; margin-top:2px}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok); background:var(--ok-bg)}
.opt.correct .key{border-color:var(--ok); color:var(--ok)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt.wrong .key{border-color:var(--bad); color:var(--bad)}
.opt.dim{opacity:.42}
.mark{margin-inline-start:auto; font-size:13px; font-weight:700; flex:none; padding-top:2px}
.opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--bad)}

/* ---------- verdict + trick ---------- */
.verdict{margin-top:18px; font-family:'Suez One',Georgia,serif; font-size:19px}
.verdict.good{color:var(--ok)} .verdict.bad{color:var(--bad)}
.trick{margin-top:12px; background:var(--panel); border:1px solid var(--line);
  border-inline-start:3px solid var(--brass); border-radius:2px; padding:14px 16px}
.trick h3{margin:0 0 5px; font-weight:700; font-size:13.5px; color:var(--brass)}
.trick p{margin:0; font-size:16.5px}
.reveal{animation:rise .28s ease both}
@keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none} .track i{transition:none}}

.next{margin-top:18px; width:100%; background:var(--brass); color:var(--panel);
  border:1px solid var(--brass); border-radius:2px; padding:13px; font-size:16px; font-weight:700}
.next:hover{background:var(--brass-bright); border-color:var(--brass-bright)}
.hint{margin-top:10px; text-align:center; font-size:13px; color:var(--muted)}
.hint kbd{font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:12px;
  border:1px solid var(--line); border-radius:2px; padding:1px 5px; color:var(--ink)}

/* ---------- summary ---------- */
.summary{background:var(--panel); border:1px solid var(--line); border-radius:2px; padding:26px; box-shadow:var(--shadow)}
.big{font-family:'Suez One',Georgia,serif; font-size:52px; line-height:1; color:var(--brass); font-variant-numeric:tabular-nums}
.summary h2{font-family:'Suez One',Georgia,serif; font-weight:400; font-size:24px; margin:0 0 4px}
.misslist{margin:20px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px}
.misslist li{display:flex; gap:12px; align-items:center; border-top:1px solid var(--line-soft); padding-top:10px}
.misslist img{width:58px; height:auto; border:1px solid var(--line); flex:none}
.misslist span{font-size:15px}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:22px}
.actions button{background:transparent; border:1px solid var(--ink); border-radius:2px; padding:10px 18px; font-weight:600}
.actions button.primary{background:var(--ink); color:var(--ground)}
.actions button:hover{border-color:var(--brass); color:var(--brass)}
.actions button.primary:hover{background:var(--brass); border-color:var(--brass); color:var(--plate)}

/* ---------- study ---------- */
.study{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:14px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:2px; padding:11px; display:flex; flex-direction:column; gap:9px}
.card .frame{background:var(--plate); border:1px solid var(--line); padding:9px; display:grid; place-items:center; min-height:120px}
.card .frame img{max-width:100%; max-height:150px; height:auto}
.card .num{font-size:12px; color:var(--brass)}
.card .num bdi{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
.card .ans{font-weight:600; font-size:15px; line-height:1.4}
.card .tp{font-size:13.5px; color:var(--muted); line-height:1.5}

/* ---------- notes / source material ---------- */
.notes{display:flex; flex-direction:column; gap:26px; max-width:900px}
.notesec{background:var(--panel); border:1px solid var(--line); border-radius:2px;
  padding:18px 20px 6px; box-shadow:var(--shadow)}
.notesec h2{font-family:'Suez One',Georgia,serif; font-weight:400; font-size:20px;
  margin:0 0 4px; display:flex; align-items:center; gap:12px}
.notesec h2::after{content:""; flex:1; height:1px; background:var(--brass); opacity:.4}
.deflist{margin:0; display:grid; grid-template-columns:minmax(140px,215px) 1fr}
.deflist>div{display:contents}
.deflist dt,.deflist dd{border-top:1px solid var(--line-soft); padding:11px 0; margin:0}
.deflist dt{font-weight:700; padding-inline-end:20px; text-wrap:balance}
.deflist dd{color:var(--muted); line-height:1.55}
@media (max-width:640px){
  .deflist{grid-template-columns:1fr}
  .deflist dt{border-bottom:0; padding-bottom:2px}
  .deflist dd{border-top:0; padding-top:0; padding-bottom:13px}
}

/* ---------- intro blurb ---------- */
.blurb{color:var(--muted); font-size:15.5px; max-width:62ch; margin:0 0 20px}

/* ---------- boat page ---------- */
.boatgrid{display:grid; grid-template-columns:1.15fr 1fr; gap:22px; align-items:start}
.cegrid{display:grid; grid-template-columns:1.25fr 1fr; gap:20px; align-items:start}
@media (max-width:760px){.cegrid{grid-template-columns:1fr}}
.panelbox{background:var(--panel); border:1px solid var(--line); border-radius:2px; padding:16px; box-shadow:var(--shadow)}
.panelbox h2{font-family:'Suez One',Georgia,serif; font-weight:400; font-size:20px; margin:0 0 4px}
.panelbox .cap{color:var(--muted); font-size:14px; margin:0 0 14px}
.drawing{background:var(--plate); border:1px solid var(--line); padding:8px; position:relative}
.drawing svg{display:block; width:100%; height:auto}
.hit{cursor:pointer}
.hit circle.dot{fill:var(--brass); stroke:var(--plate); stroke-width:2; transition:r .12s}
.hit text{fill:#05080D; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; text-anchor:middle; pointer-events:none}
.hit:hover circle.dot,.hit.sel circle.dot{r:13; fill:#F0BE60}
.hit.sel circle.halo{fill:none; stroke:#F0BE60; stroke-width:2; opacity:.55}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
.chip{background:transparent; border:1px solid var(--line); border-radius:2px; padding:5px 10px; font-size:13.5px;
  display:flex; align-items:baseline; gap:6px}
.chip b{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--brass); font-weight:600}
.chip:hover{border-color:var(--brass)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:var(--ground); opacity:.65}
.partinfo{margin-top:14px; border-top:1px solid var(--line-soft); padding-top:13px; min-height:84px}
.partinfo h3{margin:0 0 4px; font-family:'Suez One',Georgia,serif; font-weight:400; font-size:19px}
.partinfo p{margin:0; font-size:15.5px; color:var(--muted)}

/* ---------- point of sail simulator ---------- */
.simwrap{background:var(--plate); border:1px solid var(--line); padding:8px; position:relative}
.simwrap svg{display:block; width:100%; height:auto; touch-action:none}
.sailctl{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.sailctl button{background:transparent; border:1px solid var(--line); border-radius:2px; padding:5px 11px; font-size:13.5px}
.sailctl button:hover{border-color:var(--brass)}
.sailctl button[aria-pressed="true"]{background:var(--brass); color:var(--panel); border-color:var(--brass); font-weight:600}
input[type=range]{width:100%; margin-top:12px; accent-color:var(--brass)}
.readout{margin-top:14px; border-top:1px solid var(--line-soft); padding-top:13px}
.readout .pos{font-family:'Suez One',Georgia,serif; font-size:24px; line-height:1.2; margin:0}
.readout .posrange{margin:1px 0 0; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--muted)}
.stats{display:flex; flex-wrap:wrap; gap:0; margin:10px 0 0; padding:0; list-style:none}
.stats li{display:flex; flex-direction:column; gap:1px; padding:0 14px; border-inline-start:1px solid var(--line)}
.stats li:first-child{padding-inline-start:0; border:0}
.stats dt,.stats .k{font-size:12px; color:var(--muted)}
.stats .v{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; font-variant-numeric:tabular-nums}
.note{margin-top:13px; font-size:15px; padding:11px 13px; border-radius:2px;
  background:var(--ground); border:1px solid var(--line)}
.note.warn{border-color:var(--bad); color:var(--bad)}
.note b{color:var(--ink)}
.note.warn b{color:var(--bad)}

/* ---------- give-way duel ---------- */
.duel{display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:stretch; margin-top:6px}
.duelcard{background:var(--panel); border:1px solid var(--line); border-radius:2px; padding:22px 16px;
  font-size:17px; font-weight:600; line-height:1.4; text-align:center; min-height:112px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
  transition:border-color .15s, background .12s}
.duelcard em{font-style:normal; font-weight:600; font-size:13px; letter-spacing:.02em;
  border:1px solid currentColor; border-radius:2px; padding:2px 9px}
.duelcard.give em{color:var(--ok)} .duelcard.stand em{color:var(--bad)}
.duelcard:hover:not(:disabled){border-color:var(--brass)}
.duelcard.give{border-color:var(--ok); background:var(--ok-bg)}
.duelcard.stand{border-color:var(--bad); background:var(--bad-bg)}
.vs{align-self:center; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--muted)}
.duelq{font-family:'Suez One',Georgia,serif; font-size:21px; margin:0 0 4px}
@media (max-width:760px){
  .boatgrid{grid-template-columns:1fr}
  .duel{grid-template-columns:1fr; }
  .vs{padding:2px 0}
}
@media (max-width:520px){
  .app{padding:0 14px 60px}
  body{font-size:16px}
  .masthead{flex-direction:column; align-items:flex-start; gap:6px}
  .stats li{padding:0 10px}
}
</style>

<div class="app" lang="he">
  <header class="masthead">
    <div class="brandline">
      <h1>ימאות</h1>
      <span class="sub">חוברת תרגול למבחן משיט</span>
    </div>
    <div class="gauge" id="gauge"></div>
  </header>

  <nav class="pagenav" id="pagenav" aria-label="עמודים"></nav>
  <main id="stage"></main>
</div>

<script>
/*__DATA__*/

const PAGES = [
  {id:'boat',    label:'כלי השייט'},
  {id:'signals', label:'אורות וסימנים'},
  {id:'met',     label:'מטאורולוגיה'},
  {id:'rules',   label:'חוקי דרך'},
  {id:'cases',   label:'מקרים ותגובות'},
];
const CATS = [
  {id:'lights', label:'זיהוי אורות'},
  {id:'day',    label:'סימני יום'},
  {id:'flags',  label:'דגלים'},
  {id:'sound',  label:'אותות קוליים'},
  {id:'distress', label:'סימני מצוקה'},
  {id:'all',    label:'הכל מעורבב'},
];
const KEYS = ['א','ב','ג','ד'];

const $  = s => document.querySelector(s);
const stage = $('#stage'), gauge = $('#gauge');
const shuffle = a => {a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a;};
const pool = c => c==='all' ? DATA : DATA.filter(d=>d.cat===c);

const state = {page:'boat', cat:'lights', mode:'quiz', part:0, heading:135,
               rulesMode:'duel', bankMode:'quiz', boatMode:'ship', ceAct:'none'};
const quiz  = {items:[], i:0, right:0, streak:0, best:0, misses:[], answered:false, kind:'signals'};

/* ================= page shell ================= */
$('#pagenav').innerHTML = PAGES.map(p=>
  `<button data-page="${p.id}" aria-current="${p.id===state.page}">${p.label}</button>`).join('');
$('#pagenav').addEventListener('click', e=>{
  const b = e.target.closest('button[data-page]'); if(!b) return;
  state.page = b.dataset.page;
  document.querySelectorAll('#pagenav button').forEach(x=>x.setAttribute('aria-current', x===b));
  window.scrollTo({top:0,behavior:'instant'});
  render();
});

function render(){
  if(state.page==='signals') return renderSignalsPage();
  if(state.page==='boat')    return renderBoatPage();
  if(state.page==='rules')   return renderRulesPage();
  return renderBankPage(state.page);
}

/* ================= audio ================= */
let actx=null;
const HORN = {s:0.5, l:1.4, c:3.4, S:0.22, L:0.66};
function blast(t, d){
  const o1=actx.createOscillator(), o2=actx.createOscillator(), o3=actx.createOscillator();
  const g=actx.createGain(), f=actx.createBiquadFilter();
  o1.type='sawtooth'; o1.frequency.value=104;
  o2.type='sawtooth'; o2.frequency.value=156;
  o3.type='sine';     o3.frequency.value=52;
  f.type='lowpass'; f.frequency.value=780; f.Q.value=.7;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.3, t+0.06);
  g.gain.setValueAtTime(0.3, t+d-0.09);
  g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  [o1,o2,o3].forEach(o=>{o.connect(f); o.start(t); o.stop(t+d+0.03);});
  f.connect(g); g.connect(actx.destination);
}
function strike(t, f, decay, vol){
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t+decay);
  [[1,1],[2.76,0.6],[5.4,0.32],[8.9,0.16]].forEach(([m,a])=>{
    const o = actx.createOscillator(); o.type='sine'; o.frequency.value = f*m;
    const gg = actx.createGain(); gg.gain.value = a;
    o.connect(gg); gg.connect(g); o.start(t); o.stop(t+decay+0.05);
  });
  g.connect(actx.destination);
}
const ring = (t,f,span,step,decay,vol)=>{ for(let k=0;k*step<span;k++) strike(t+k*step,f,decay,vol); };
function playPattern(pat, btn){
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
  const start = actx.currentTime + 0.06; let t = start;
  for(const p of pat){
    if(p in HORN){ blast(t, HORN[p]); t += HORN[p] + (p==='S'||p==='L' ? 0.22 : 0.38); }
    else if(p==='b3'){ ring(t,760,1.3,0.5,0.9,0.3);   t += 1.8; }
    else if(p==='b5'){ ring(t,760,2.6,0.11,0.42,0.2); t += 3.05; }
    else if(p==='g5'){ ring(t,190,2.6,0.13,0.75,0.26);t += 3.05; }
  }
  if(btn){ btn.classList.add('on'); setTimeout(()=>btn.classList.remove('on'), (t-start)*1000); }
}

/* ================= shared quiz engine ================= */
function startQuiz(kind, items){
  Object.assign(quiz, {kind, items:shuffle(items), i:0, right:0, streak:0, best:0, misses:[], answered:false});
}
function optionsFor(it){
  if(it.opts) return shuffle([it.a, ...it.opts]);
  const seen = new Set([it.a]), picks = [];
  for(const o of shuffle(pool(it.cat))){
    if(!seen.has(o.a)){ seen.add(o.a); picks.push(o.a); }
    if(picks.length===3) break;
  }
  return shuffle([it.a, ...picks]);
}
function gaugeQuiz(){
  const done = quiz.i, pct = done ? Math.round(quiz.right/done*100) : 0;
  gauge.innerHTML = `<span>נכונות <bdi>${quiz.right}/${done}</bdi></span>`
                  + `<span>דיוק <bdi>${pct}%</bdi></span>`
                  + `<span>רצף <bdi>${quiz.streak}</bdi></span>`;
  const t = $('#track i'); if(t) t.style.width = (quiz.i/quiz.items.length*100)+'%';
}
function quizBody(it, ask){
  const opts = optionsFor(it);
  quiz._opts = opts;
  const media = it.img
    ? `<div class="plate">
         <div class="cartouche">
           <span class="stamp">${it.lab.replace(/(\d+)/,'<bdi>$1</bdi>')}</span>
           <img src="${it.img}" alt="${it.lab}">
         </div>
         ${it.pat ? `<button class="horn" id="horn">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
           השמע את האות</button>` : ''}
       </div>`
    : `<div class="stem"><span class="eyebrow">${it.lab}</span>${it.stem}</div>`;
  return `${media}
    <p class="ask">${ask}</p>
    <div class="opts" id="opts">
      ${opts.map((o,k)=>`<button class="opt" data-i="${k}"><span class="key">${KEYS[k]}</span><span>${o}</span></button>`).join('')}
    </div>
    <div id="after"></div>`;
}
function wireQuiz(it){
  if(it.pat && $('#horn')){ const h=$('#horn'); h.onclick=()=>playPattern(it.pat,h); }
  $('#opts').addEventListener('click', e=>{
    const b = e.target.closest('.opt'); if(!b || quiz.answered) return;
    gradeQuiz(quiz._opts[+b.dataset.i], it);
  });
  quiz.answered = false;
  gaugeQuiz();
}
function gradeQuiz(chosen, it){
  quiz.answered = true;
  const ok = chosen === it.a;
  if(ok){ quiz.right++; quiz.streak++; quiz.best = Math.max(quiz.best, quiz.streak); }
  else { quiz.streak = 0; quiz.misses.push(it); }
  document.querySelectorAll('.opt').forEach((b,k)=>{
    b.disabled = true;
    if(quiz._opts[k] === it.a){ b.classList.add('correct'); b.insertAdjacentHTML('beforeend','<span class="mark">✓</span>'); }
    else if(quiz._opts[k] === chosen){ b.classList.add('wrong'); b.insertAdjacentHTML('beforeend','<span class="mark">✕</span>'); }
    else b.classList.add('dim');
  });
  $('#after').innerHTML = `
    <p class="verdict reveal ${ok?'good':'bad'}">${ok?'נכון.':'לא נכון — התשובה מסומנת למעלה.'}</p>
    <div class="trick reveal"><h3>טריק לזכירה</h3><p>${it.tip}</p></div>
    <button class="next" id="next">${quiz.i+1 < quiz.items.length ? 'הבא' : 'לסיכום הסבב'}</button>
    <p class="hint">בחירה עם <kbd>1</kbd>–<kbd>4</kbd> · מעבר עם <kbd>Enter</kbd></p>`;
  $('#next').onclick = advance;
  quiz.i++; gaugeQuiz();
  $('#next').focus({preventScroll:true});
}
function advance(){ quiz.answered=false; render(); window.scrollTo({top:0,behavior:'instant'}); }
function summaryHTML(extra){
  const pct = Math.round(quiz.right/quiz.items.length*100);
  const verdict = pct>=90 ? 'ניווט בטוח. אתה שולט בחומר.'
                : pct>=75 ? 'קרוב מאוד. עוד סבב על הטעויות ואתה שם.'
                : pct>=50 ? 'הבסיס קיים, הפרטים המדויקים עוד מתבלבלים.'
                : 'שווה לעבור על החומר לפני הסבב הבא.';
  return `<div class="summary">
      <div class="big">${pct}%</div>
      <h2>${quiz.right} מתוך ${quiz.items.length}</h2>
      <p style="margin:0;color:var(--muted)">${verdict} הרצף הארוך ביותר: ${quiz.best}.</p>
      ${quiz.misses.length ? `<ul class="misslist">${quiz.misses.map(m=>
        `<li>${m.img?`<img src="${m.img}" alt="">`:''}<span><b>${m.img?m.lab:m.stem}</b> — ${m.a}</span></li>`).join('')}</ul>`
        : '<p style="margin-top:18px">בלי טעויות בכלל.</p>'}
      <div class="actions">
        ${quiz.misses.length ? `<button class="primary" id="again">תרגל שוב את ${quiz.misses.length} הטעויות</button>`:''}
        <button id="fresh">סבב חדש</button>${extra||''}
      </div></div>`;
}
function wireSummary(startFresh){
  if($('#again')) $('#again').onclick = ()=>{ startQuiz(quiz.kind, quiz.misses); render(); };
  $('#fresh').onclick = startFresh;
}

  $('#rBody').innerHTML = `
    <div class="narrow">
      <p class="blurb">שני כלי שייט נפגשים בקורס התנגשות. לחץ על זה שחייב לפנות.</p>

function gradeDuel(pick){
  duel.answered = true; duel.total++;
  // the lower rank gives way
  const giver = duel.a[1] < duel.b[1] ? 'a' : 'b';
  const ok = pick === giver;
  if(ok) duel.right++;
  document.querySelectorAll('.duelcard').forEach(c=>{
    c.disabled = true;
    const isGiver = c.dataset.s===giver;
    c.classList.add(isGiver ? 'give' : 'stand');
    c.insertAdjacentHTML('beforeend',
      `<em>${isGiver ? 'מפנה את הדרך' : 'שומר קורס ומהירות'}</em>`);
  });
  const G = duel[giver], S = duel[giver==='a'?'b':'a'];
  $('#duelAfter').innerHTML = `
    <p class="verdict reveal ${ok?'good':'bad'}">${ok?'נכון.':'לא נכון.'}</p>
    <div class="trick reveal"><h3>למה</h3>
      <p><b>${G[0]}</b> מפנה ל<b>${S[0]}</b>. סדר הפינוי הוא
      ממוכן ← מפרשית ← דייג ← מוגבל בכושרו לתמרן ← ללא שליטה: ככל שקשה לך יותר לתמרן, כך יותר מפנים לך.
      ${S[0]} חייב לשמור על קורס ומהירות.</p></div>
    <button class="next" id="next">הזוג הבא</button>`;
  $('#next').onclick = ()=>{ newDuel(); render(); };
  $('#next').focus({preventScroll:true});
  gauge.innerHTML = `<span>נכונות <bdi>${duel.right}/${duel.total}</bdi></span>`;
}

          ${CE_ACTS.map(a=>`<button data-a="${a.id}">${a.label}</button>`).join('')}
        </div>
        <div class="readout" id="ceOut"></div>
      </div>
    </div>
  </section>`;

  $('#ceActs').addEventListener('click', e=>{
    const b = e.target.closest('button[data-a]'); if(!b) return;
    state.ceAct = b.dataset.a; updateCE();
  });
  updateCE();

  $('#chips').addEventListener('click', e=>{
    const b=e.target.closest('.chip'); if(!b) return; selectPart(+b.dataset.k);
  });
  document.querySelectorAll('.hit').forEach(g=>{
    g.addEventListener('click', ()=>selectPart(+g.dataset.k));
  });
  const sim = $('#simsvg');
  const setFromEvent = ev=>{
    const r = sim.getBoundingClientRect();
    const px = (ev.clientX - r.left)/r.width*420, py = (ev.clientY - r.top)/r.height*470;
    const dx = px-210, dy = py-250;
    if(Math.hypot(dx,dy) < 26) return;
    let deg = Math.atan2(dx, -dy)*180/Math.PI;
    state.heading = Math.round((deg+360)%360);
    $('#hdg').value = state.heading; updateSim();
  };
  let dragging=false;
  sim.addEventListener('pointerdown', e=>{dragging=true; sim.setPointerCapture(e.pointerId); setFromEvent(e);});
  sim.addEventListener('pointermove', e=>{ if(dragging) setFromEvent(e); });
  sim.addEventListener('pointerup',   ()=>{dragging=false;});
  $('#hdg').addEventListener('input', e=>{ state.heading = +e.target.value; updateSim(); });
  $('#presets').addEventListener('click', e=>{
    const b=e.target.closest('button[data-h]'); if(!b) return;
    state.heading = +b.dataset.h; $('#hdg').value = state.heading; updateSim();
  });
  selectPart(state.part); updateSim();
}

function selectPart(k){
  state.part = k;
  document.querySelectorAll('.chip').forEach((c,i)=>c.setAttribute('aria-pressed', i===k));
  document.querySelectorAll('.hit').forEach((g,i)=>g.classList.toggle('sel', i===k));
  const p = PARTS[k];
  $('#partinfo').innerHTML = `<h3>${p[1]}</h3><p>${p[4]}</p>`;
}

/* --- CE / CLR: how each action swings the bow --- */
const CE_ACTS = [
  {id:'none',   label:'מצב מאוזן',        ce:0,   clr:0,  why:'CE וציר הסיבוב מיושרים. הספינה שומרת על הקורס.'},
  {id:'jib',    label:'צמצום החלוץ',      ce:-38, clr:0,  why:'החלוץ נמצא לפני הציר. מצמצמים אותו, הכוח הקדמי קטן, ומה שנשאר הוא הראשי שמאחור.'},
  {id:'main',   label:'צמצום הראשי',      ce:38,  clr:0,  why:'הראשי נמצא מאחורי הציר. מצמצמים אותו, הכוח האחורי קטן, ומה שנשאר הוא החלוץ שלפנים.'},
  {id:'mizzen', label:"צמצום המאסף (קטץ')", ce:32, clr:0, why:'המאסף הוא המפרש האחורי ביותר, ולכן צמצומו מוריד כוח מאחורי הציר.'},
  {id:'fwd',    label:'העברת משקל קדימה', ce:0,   clr:34, why:'המשקל מזיז את ציר הסיבוב לפנים, ולכן CE נשאר יחסית מאחוריו.'},
  {id:'aft',    label:'העברת משקל אחורה', ce:0,   clr:-34,why:'המשקל מזיז את הציר אחורה, ולכן CE נשאר יחסית לפניו.'},
  {id:'heel',   label:'הטיה',             ce:0,   clr:0,  heel:true, why:'הטיה מעלה את הספינה אל הרוח בזכות צורת הגוף השקוע, גם בלי שינוי במפרשים.'},
];
function ceSVG(){
  return `<svg id="cesvg" viewBox="0 0 440 260" role="img" aria-label="מאזן הכוחות בין CE ל-CLR">
    <rect width="440" height="260" fill="#05080D"/>
    <line x1="0" y1="196" x2="440" y2="196" stroke="#1D5E7A" stroke-width="2"/>
    <g id="cebody"></g>
  </svg>`;
}
function updateCE(){
  const A = CE_ACTS.find(a=>a.id===state.ceAct) || CE_ACTS[0];
  const ce  = 232 + A.ce;      // bow is to the right: forward = +x
  const clr = 232 + A.clr;
  const up  = A.heel ? true : (ce < clr);        // CE abaft the pivot -> rounds up
  const neutral = !A.heel && ce === clr;
  const tilt = A.heel ? -9 : 0;
  const col = neutral ? '#7E8C9E' : (up ? '#E0A63A' : '#5FB0D6');

  document.getElementById('cebody').innerHTML = `
    <g transform="rotate(${tilt} 232 196)">
      <path d="M96 168 L372 160 C368 186 340 198 286 200 L150 200 C118 198 100 186 96 168 Z"
            fill="#151E29" stroke="#C9D3DF" stroke-width="2.5"/>
      <path d="M214 200 L250 200 L244 236 L220 236 Z" fill="#151E29" stroke="#C9D3DF" stroke-width="2.5"/>
      <line x1="248" y1="164" x2="248" y2="36" stroke="#C9D3DF" stroke-width="4"/>
      <path d="M248 44 L248 158 L150 162 Z" fill="#8DA2B8" fill-opacity=".38" stroke="#A9BACB" stroke-width="1.8"/>
      <path d="M252 56 L350 160 L252 158 Z" fill="#8DA2B8" fill-opacity=".30" stroke="#A9BACB" stroke-width="1.8"/>
      <line x1="${clr}" y1="24" x2="${clr}" y2="248" stroke="#E0A63A" stroke-width="1.5"
            stroke-dasharray="6 6" opacity=".55"/>
      <circle cx="${ce}"  cy="112" r="9" fill="#EDF2F7"/>
      <text x="${ce}"  y="96"  text-anchor="middle" fill="#EDF2F7" font-family="IBM Plex Mono,monospace" font-size="13">CE</text>
      <circle cx="${clr}" cy="218" r="9" fill="#E0A63A"/>
      <text x="${clr}" y="246" text-anchor="middle" fill="#E0A63A" font-family="IBM Plex Mono,monospace" font-size="13">CLR</text>
    </g>
    ${neutral ? '' : `
      <path d="${up ? 'M366 92 A54 54 0 0 0 366 34' : 'M366 34 A54 54 0 0 0 366 92'}"
            fill="none" stroke="${col}" stroke-width="4"/>
      <polygon points="${up ? '366,26 374,42 358,42' : '366,100 374,84 358,84'}" fill="${col}"/>`}`;

  const verdict = neutral ? 'שומרת על הקורס' : (up ? 'הספינה תעלה לרוח' : 'הספינה תרד מהרוח');
  const pos = neutral ? 'CE וציר הסיבוב מיושרים'
            : A.heel ? 'ההטיה עצמה מסובבת את הספינה אל הרוח'
            : (ce < clr ? 'CE נמצא מאחורי ציר הסיבוב' : 'CE נמצא לפני ציר הסיבוב');
  const iso = t => t.replace(/\b(CE|CLR)\b/g, '<bdi>$1</bdi>');
  $('#ceOut').innerHTML = `
    <p class="pos" style="color:${col}">${verdict}</p>
    <p class="posrange">${iso(pos)}</p>
    <div class="note">${iso(A.why)}</div>`;
  document.querySelectorAll('#ceActs button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.a===A.id));
}

/* --- point of sail --- */
function pos(twa){
  // מונחי הזוויות לפי המינוח הרשמי: קדמית חדה 30–45, קדמית קהה 45–80,
  // רוח צד 80–100, רוח גבית 100–170, רוח מלאה 170–180
  if(twa < 30)  return {name:'מול הרוח', sub:'אזור מת · 0°–30°', kind:'nogo'};
  if(twa < 45)  return {name:'רוח קדמית חדה', sub:'30°–45°', kind:'sharp'};
  if(twa < 80)  return {name:'רוח קדמית קהה', sub:'45°–80°', kind:'blunt'};
  if(twa <=100) return {name:'רוח צד',        sub:'80°–100°', kind:'beam'};
  if(twa < 170) return {name:'רוח גבית',      sub:'100°–170°', kind:'broad'};
  return {name:'רוח מלאה', sub:'170°–180°', kind:'run'};
}
function simSVG(){
  return `<svg id="simsvg" viewBox="0 0 420 470" role="img" aria-label="סימולטור זווית הרוח">
    <rect width="420" height="470" fill="#05080D"/>
    <g stroke="#2C6E8C" stroke-width="2" fill="none" opacity=".9">
      <path d="M70 20 L70 84 M120 20 L120 84 M170 20 L170 84 M220 20 L220 84 M270 20 L270 84 M320 20 L320 84 M350 20 L350 84"/>
      <path d="M70 84 l-6 -10 M70 84 l6 -10 M120 84 l-6 -10 M120 84 l6 -10 M170 84 l-6 -10 M170 84 l6 -10
               M220 84 l-6 -10 M220 84 l6 -10 M270 84 l-6 -10 M270 84 l6 -10 M320 84 l-6 -10 M320 84 l6 -10
               M350 84 l-6 -10 M350 84 l6 -10"/>
    </g>
    <text x="210" y="14" text-anchor="middle" fill="#5E7C90" font-family="Assistant,sans-serif" font-size="13">הרוח</text>
    <circle cx="210" cy="250" r="150" fill="none" stroke="#16202B" stroke-width="1.5"/>
    <circle cx="210" cy="250" r="118" fill="none" stroke="#101A24" stroke-width="1.5"/>
    <path id="nogo" d="" fill="#E0A63A" fill-opacity=".08" stroke="#E0A63A" stroke-opacity=".3" stroke-width="1"/>
    <g id="boat"></g>
  </svg>`;
}
function updateSim(){
  const h = ((state.heading%360)+360)%360;
  const twa = h<=180 ? h : 360-h;
  const P = pos(twa);
  const portTack = h>0 && h<180;          // wind over the port side
  const side = portTack ? 1 : -1;          // sails to leeward
  const boom = Math.max(0, Math.min(85, (twa-30)*0.62));
  const luff = P.kind==='nogo';
  const wing = twa>=165;

  // no-go wedge
  const wedge = (()=>{
    const r=150, a=30*Math.PI/180;
    const x1=210+r*Math.sin(-a), y1=250-r*Math.cos(-a), x2=210+r*Math.sin(a), y2=250-r*Math.cos(a);
    return `M210 250 L${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z`;
  })();
  document.getElementById('nogo').setAttribute('d', wedge);

  // local +x is starboard; the sails always swing to leeward
  const lee  = portTack ? 1 : -1;
  const ba   = luff ? 0 : -boom * lee;
  const ja   = luff ? 0 : -boom * 0.8 * lee * (wing ? -1 : 1);
  const rad  = d => d*Math.PI/180;
  const rot  = (x,y,d) => [x*Math.cos(rad(d)) - y*Math.sin(rad(d)), x*Math.sin(rad(d)) + y*Math.cos(rad(d))];
  const num  = v => v.toFixed(1);

  const mastPt = [0,-6];
  const [bx,by] = rot(0, 54, ba);                       // boom end
  const mc = [(mastPt[0]+bx)/2 + lee*11, (mastPt[1]+by)/2];
  const tackPt = [0,-58];
  const [jx,jy] = rot(0, 44, ja);
  const clew = [tackPt[0]+jx, tackPt[1]+jy];
  const jc = [(tackPt[0]+clew[0])/2 + lee*(wing?-1:1)*9, (tackPt[1]+clew[1])/2];
  const dash = luff ? ' stroke-dasharray="7 5" opacity=".65"' : '';

  document.getElementById('boat').innerHTML = `
    <g transform="translate(210,250) rotate(${h}) scale(1.35)">
      <path d="M0 -62 C16 -30 20 6 16 44 L-16 44 C-20 6 -16 -30 0 -62 Z"
            fill="#151E29" stroke="#C9D3DF" stroke-width="2.4"/>
      <path d="M-16 28 L-16 44 L-4 44 L-4 24 Z" fill="var(--port)"/>
      <path d="M16 28 L16 44 L4 44 L4 24 Z" fill="var(--stbd)"/>
      <line x1="0" y1="-6" x2="${num(bx)}" y2="${num(by)}" stroke="#7E8C9E" stroke-width="2.4"/>
      <path d="M0 -6 Q${num(jc[0])} ${num(jc[1])} 0 0" fill="none"/>
      <path d="M${num(tackPt[0])} ${num(tackPt[1])} Q${num(jc[0])} ${num(jc[1])} ${num(clew[0])} ${num(clew[1])}"
            fill="none" stroke="#B9C7D6" stroke-width="3.4" stroke-linecap="round"${dash}/>
      <path d="M0 -6 Q${num(mc[0])} ${num(mc[1])} ${num(bx)} ${num(by)}"
            fill="none" stroke="#EDF2F7" stroke-width="4.2" stroke-linecap="round"${dash}/>
      <circle cx="0" cy="-6" r="4" fill="#E0A63A"/>
    </g>`;

  const tack = (h===0||h===180) ? '—' : (portTack ? 'מפנה שמאלי' : 'מפנה ימני');
  const trim = luff ? 'המפרשים מתנפנפים — אין הנעה'
             : P.kind==='sharp' ? 'שוטים מהודקים כמעט לגמרי'
             : P.kind==='blunt' ? 'שוטים מהודקים למדי, מעט משוחררים'
             : P.kind==='beam'  ? 'שוטים משוחררים בערך לחצי'
             : P.kind==='broad' ? 'שוטים משוחררים ברובם'
             : 'שוטים משוחררים עד הסוף';
  let note, warn=false;
  if(luff){
    note = `<b>מול הרוח.</b> עד כ-30° הרוח נגדית ואי אפשר להתקדם: המפרשים מתנפנפים והספינה נעצרת. צריך ליפול מהרוח כדי לצבור מהירות.`;
    warn = true;
  } else if(P.kind==='sharp'){
    note = `<b>הזווית החדה ביותר שאפשר להפליג בה.</b> המינוח מגדיר קדמית חדה מ-30°, אבל ספינת שיוט טיפוסית לא באמת עולה מעל כ-45°.`;
  } else if(P.kind==='blunt'){
    note = `<b>קדמית קהה.</b> פתוחה מספיק כדי שגם ספינה פחות מתקדמת תתקדם בה היטב, ועדיין מתקרבים לרוח.`;
  } else if(P.kind==='beam'){
    note = `<b>הרוח בדיוק מהצד</b> — הזווית המהירה והנוחה ביותר. הספינה יציבה ושני המפרשים עובדים במלואם.`;
  } else if(wing){
    note = `<b>סכנת ג'יבה לא מבוקרת.</b> ברוח מלאה הבום עלול לחצות בכוח מדופן לדופן. כאן החלוץ מוצג בפרפר — בצד הנגדי לראשי.`;
    warn = true;
  } else {
    note = `<b>רוח גבית.</b> נוח ומהיר, אבל ככל שיורדים יותר — הראשי מסתיר את החלוץ ומרוקן אותו מרוח.`;
  }
  const rw = (h===0||h===180) ? ''
    : (portTack ? 'אתה במפנה שמאלי, ולכן <b>מפנה את הדרך</b> למפרשית במפנה ימני.'
                : 'אתה במפנה ימני, ולכן <b>שומר על קורס ומהירות</b> מול מפרשית במפנה שמאלי.');

  $('#readout').innerHTML = `
    <p class="pos">${P.name}</p>
    <p class="posrange">${P.sub}</p>
    <ul class="stats">
      <li><span class="k">זווית הרוח</span><span class="v">${twa}°</span></li>
      <li><span class="k">כיוון החרטום</span><span class="v">${h}°</span></li>
      <li><span class="k">מפנה</span><span class="v">${tack}</span></li>
    </ul>
    <div class="note ${warn?'warn':''}">${note}</div>
    <div class="note">שוטים: ${trim}.${rw?' '+rw:''}</div>`;
  document.querySelectorAll('#presets button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.h===h));
}

/* ================= keyboard ================= */
document.addEventListener('keydown', e=>{
  if(state.page==='boat') return;
  if(['1','2','3','4'].includes(e.key)){
    const b = document.querySelectorAll('.opt')[+e.key-1];
    if(b && !quiz.answered){ e.preventDefault(); b.click(); }
  }
  if((e.key==='Enter'||e.key===' ') && $('#next')){ e.preventDefault(); $('#next').click(); }
});

render();
</script>
